    --ff-orange: #FF6B00;
    --ff-yellow: #FFD700;
    --ff-red: #FF2020;
    --ff-dark: #0A0A0F;
    --ff-card: #12121A;
    --ff-border: #FF6B0044;
    --ff-glow: #FF6B0088;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, #FF6B0022 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 80% 80%, #FF200011 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid var(--ff-border);
    margin-bottom: 30px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--ff-orange), transparent);
  }
  .logo-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--ff-orange), var(--ff-red));
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, var(--ff-yellow) 50%, var(--ff-orange) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    text-shadow: none;
  }
  .subtitle {
    color: #aaa;
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* DEVICE TYPE TOGGLE */
  .device-type-section {
    margin-bottom: 24px;
  }
  .section-label {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--ff-orange);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .toggle-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    flex: 1;
    min-width: 140px;
    padding: 14px 20px;
    background: var(--ff-card);
    border: 1px solid var(--ff-border);
    border-radius: 6px;
    color: #888;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .toggle-btn:hover { border-color: var(--ff-orange); color: var(--ff-orange); }
  .toggle-btn.active {
    background: linear-gradient(135deg, #FF6B0022, #FF6B0044);
    border-color: var(--ff-orange);
    color: var(--ff-orange);
    box-shadow: 0 0 20px #FF6B0033;
  }

  /* DEVICE OPTION BUTTONS - Old/New */
  .mode-section { margin-bottom: 24px; }
  .mode-group { display: flex; gap: 10px; }
  .mode-btn {
    flex: 1;
    padding: 12px;
    background: var(--ff-card);
    border: 1px solid #ffffff22;
    border-radius: 6px;
    color: #666;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .mode-btn .mode-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .mode-btn .mode-sub { font-size: 11px; color: #555; letter-spacing: 1px; }
  .mode-btn:hover { border-color: var(--ff-yellow); color: #fff; }
  .mode-btn.active {
    background: linear-gradient(135deg, #FFD70022, #FF6B0022);
    border-color: var(--ff-yellow);
    color: var(--ff-yellow);
  }
  .mode-btn.active .mode-sub { color: #FFD70088; }

  /* SEARCH */
  .search-section { margin-bottom: 24px; }
  .search-box {
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px;
    color: var(--ff-orange);
    pointer-events: none;
  }
  #deviceSearch {
    width: 100%;
    padding: 16px 16px 16px 48px;
    background: var(--ff-card);
    border: 1px solid var(--ff-border);
    border-radius: 8px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #deviceSearch:focus {
    border-color: var(--ff-orange);
    box-shadow: 0 0 0 3px #FF6B0022;
  }
  #deviceSearch::placeholder { color: #555; }

  /* DROPDOWN */
  #dropdownList {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #1A1A25;
    border: 1px solid var(--ff-border);
    border-radius: 8px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 100;
    display: none;
    box-shadow: 0 20px 60px #00000088;
  }
  #dropdownList.show { display: block; }
  .drop-item {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #ffffff08;
    font-size: 14px;
    color: #ccc;
    transition: background 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;

  .drop-item:hover { background: #FF6B0018; color: var(--ff-orange); }
  .drop-item:last-child { border-bottom: none; }
  .drop-brand { font-size: 10px; color: #555; background: #ffffff0a; padding: 2px 6px; border-radius: 3px; }
  #dropdownList::-webkit-scrollbar { width: 4px; }
  #dropdownList::-webkit-scrollbar-track { background: transparent; }
  #dropdownList::-webkit-scrollbar-thumb { background: var(--ff-orange); border-radius: 4px; }

  /* RESULT CARD */
  #resultCard {
    display: none;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header {
    background: linear-gradient(135deg, #FF6B0015, #FF200010);
    border: 1px solid var(--ff-border);
    border-radius: 12px 12px 0 0;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: none;

    font-size: 9px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    white-space: nowrap;

  .sens-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--ff-border);
    border: 1px solid var(--ff-border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;

  .sens-item {

    padding: 18px 16px;
    text-align: center;
    transition: background 0.3s;
    position: relative;

  .sens-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    transition: background 0.3s;

  .sens-item:hover { background: #FF6B000D; }
  .sens-label {

    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-family: 'Orbitron', monospace;

  .sens-value {

// ===================== STATE =====================
let activeType = 'all';
let activeMode = 'old';
let currentDevice = null;

const popularNames = [
  "iPhone 11", "iPhone 13 Pro", "Samsung S21", "Redmi Note 10",
  "OnePlus 9 Pro", "Poco F3", "Oppo Reno 4", "Google Pixel 6",
  "Realme 8 Pro", "Vivo V21 5G", "Redmi 14C", "Galaxy A50"
];

// ===================== INIT =====================
window.onload = () => {
  buildPopular();
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) hideDropdown();
  });
};

function buildPopular() {
  const grid = document.getElementById('popularGrid');
  grid.innerHTML = '';
  popularNames.forEach(n => {
    const d = devices.find(d => d.name.toLowerCase().includes(n.toLowerCase()));
    if (d) {
      const chip = document.createElement('button');
      chip.className = 'pop-chip';
      chip.textContent = d.name;
      chip.onclick = () => selectDevice(d);
      grid.appendChild(chip);
    }
  });
}

function setDeviceType(t) {
  activeType = t;
  document.querySelectorAll('.toggle-btn').forEach((b, i) => {
    b.classList.toggle('active', ['all','iphone','android'][i] === t);
  });
  if (currentDevice) showResult(currentDevice);
  onSearch();
}

function setMode(m) {
  activeMode = m;
  document.getElementById('modeOld').classList.toggle('active', m === 'old');
  document.getElementById('modeNew').classList.toggle('active', m === 'new');
  if (currentDevice) showResult(currentDevice);
}

// ===================== SEARCH =====================
function getFiltered() {
  if (activeType === 'all') return devices;
  return devices.filter(d => d.type === activeType);
}

function onSearch() {
  const q = document.getElementById('deviceSearch').value.toLowerCase().trim();
  const list = document.getElementById('dropdownList');
  const filtered = getFiltered().filter(d =>
    d.name.toLowerCase().includes(q) || d.brand.toLowerCase().includes(q)
  );
  if (filtered.length === 0 || q === '') {
    if (q === '') {
      // show top 12
      const top = getFiltered().slice(0, 14);
      renderDropdown(top);
    } else {
      list.innerHTML = '<div class="drop-item" style="color:#555">No results found</div>';
      list.classList.add('show');
    }
    return;
  }
  renderDropdown(filtered.slice(0, 14));
}

function renderDropdown(items) {
  const list = document.getElementById('dropdownList');
  list.innerHTML = '';
  items.forEach(d => {
    const div = document.createElement('div');
    div.className = 'drop-item';
    const icon = d.type === 'iphone' ? '🍎' : '📱';
    div.innerHTML = `${icon} ${d.name} <span class="drop-brand">${d.brand}</span>`;
    div.onclick = () => selectDevice(d);
    list.appendChild(div);
  });
  list.classList.add('show');
}

function hideDropdown() {
  document.getElementById('dropdownList').classList.remove('show');
}

function selectDevice(d) {
  currentDevice = d;
  document.getElementById('deviceSearch').value = d.name;
  hideDropdown();
  showResult(d);
}

// ===================== SHOW RESULT =====================
function showResult(d) {
  const card = document.getElementById('resultCard');
  const noResult = document.getElementById('noResult');
  noResult.style.display = 'none';

  const isIphone = d.type === 'iphone';
  const icon = isIphone ? '🍎' : '📱';
  const hasDPI = !!d.dpi;
  const showDPI = hasDPI && activeMode === 'old';

  const modeNote = isIphone
    ? '<span style="color:#FF6B00;font-size:11px;letter-spacing:1px;">iOS — No DPI Required</span>'
    : (activeMode === 'old'
        ? '<span style="color:#FFD700;font-size:11px;">Old Device Mode — Set DPI First</span>'
        : '<span style="color:#aaa;font-size:11px;">New Device — Apply Directly In-Game</span>');

  card.innerHTML = `
    <div class="result-header">
      <div class="device-icon-big">${icon}</div>
      <div>
        <div class="device-name-big">${d.name}</div>
        <div class="device-meta">${d.brand} &nbsp;•&nbsp; ${modeNote}</div>
      </div>
      <div class="vip-badge">⭐ VIP SENS</div>
    </div>
    <div class="sens-grid">
      <div class="sens-item">
        <div class="sens-label">General</div>
        <div class="sens-value">${d.gen}</div>
      </div>
      <div class="sens-item">
        <div class="sens-label">Red Dot</div>
        <div class="sens-value">${d.red}</div>
      </div>
      <div class="sens-item">
        <div class="sens-label">2x Scope</div>
        <div class="sens-value">${d.s2x}</div>
      </div>
      <div class="sens-item highlight">
        <div class="sens-label">4x Scope</div>
        <div class="sens-value">${d.s4x}</div>
      </div>
      <div class="sens-item">
        <div class="sens-label">Sniper</div>
        <div class="sens-value">${d.sniper}</div>
      </div>
      <div class="sens-item">
        <div class="sens-label">Free Look</div>
        <div class="sens-value">${d.look}</div>
      </div>
    </div>
    ${showDPI ? `
    <div class="dpi-row">
      <div>
        <div class="dpi-label">📊 RECOMMENDED DPI</div>
        <div style="font-size:11px;color:#666;margin-top:2px;">Set in phone settings</div>
      </div>
      <div class="dpi-val">${d.dpi}</div>
    </div>` : ''}
    <div class="fire-row">
      <div>
        <div class="fire-label">🔥 FIRE BUTTON SIZE</div>
        <div style="font-size:11px;color:#666;margin-top:2px;">Adjust in HUD layout</div>
      </div>
      <div class="fire-val">${d.fire}</div>
    </div>
  `;

  card.style.display = 'block';
}
